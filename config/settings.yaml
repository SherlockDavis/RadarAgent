llm:
  provider: openai                  # 复用 OpenAI 兼容客户端
  filter_model: deepseek-v4-flash       # 过滤评分，便宜
  digest_model: deepseek-v4-flash       # 简报生成（想更强可换 deepseek-v4-pro）
  api_key: ${DEEPSEEK_API_KEY}
  base_url: https://api.deepseek.com

embedding:
  # DeepSeek 没有 embedding API；Phase 2 启用 RAG 时再配 OpenAI / 本地模型
  provider: openai
  model: text-embedding-3-small

storage:
  type: chroma
  chroma:
    persist_directory: ./data/chroma

plugins:
  - id: hn-frontpage
    type: rss
    config:
      urls:
        - https://hnrss.org/frontpage
      schedule: "*/30 * * * *"
      default_language: en

  # 取消注释下面任意一段即可启用对应插件。
  # 多源会被调度器并行抓取（互不阻塞，单源失败不影响其他）。

  # # 直接用 HN Firebase API（比 hnrss 元数据更丰富：score / comments / author）
