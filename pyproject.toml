[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radaragent"
version = "0.0.1"
description = "A 24/7 multi-user personal intelligence web platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sherlock" }]
keywords = ["intelligence", "rag", "llm", "agent", "monitoring"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    # Phase 1 — core runtime
    "aiohttp>=3.9",
    "apscheduler>=3.10",
    "feedparser>=6.0",
    "openai>=1.30",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Phase 2b — persistence (Chroma vector store)
    "chromadb>=0.5",
    # Phase 3 — users, subscriptions, email
    "bcrypt>=4.1",
    "aiosmtplib>=3.0",
]

[project.optional-dependencies]
# Local embedding model (~2.3GB bge-m3 + ~1.5GB torch). Install with:
#   pip install -e ".[local-embed]"
# Then for CUDA, replace torch with the cu121 wheel:
#   pip install torch --index-url https://download.pytorch.org/whl/cu121 --force-reinstall
# transformers<4.50 cap: 4.50 backported CVE-2025-32434, hard-requiring
# torch>=2.6 OR safetensors-on-main to load weights via torch.load. BAAI/bge-m3
# only ships pytorch_model.bin on its main HF ref, so the modern stack errors
# out. Pinning to the pre-CVE line keeps the local path working without forcing
# a 2.5GB torch re-download. To use a newer transformers, upgrade torch first:
#   pip install --upgrade torch --index-url https://download.pytorch.org/whl/cu124
local-embed = [
    "sentence-transformers>=2.7,<4",
    "transformers<4.50",
    "huggingface-hub<0.30",
    "torch>=2.2",
]
anthropic = ["anthropic>=0.25"]
qdrant = ["qdrant-client>=1.9"]
telegram = ["python-telegram-bot>=21.0"]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/SherlockDavis/RadarAgent"
Repository = "https://github.com/SherlockDavis/RadarAgent"
Issues = "https://github.com/SherlockDavis/RadarAgent/issues"

[project.scripts]
radaragent = "radaragent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/radaragent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "feedparser.*",
    "apscheduler.*",
    "chromadb.*",
    "sentence_transformers.*",
    "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
