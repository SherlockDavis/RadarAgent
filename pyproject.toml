[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radaragent"
version = "0.0.1"
description = "A domain-agnostic 24/7 intelligence system framework"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sherlock" }]
keywords = ["intelligence", "rag", "llm", "agent", "monitoring"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    # Phase 1 dependencies — adjust as the project grows
    "aiohttp>=3.9",
    "apscheduler>=3.10",
    "feedparser>=6.0",
    "openai>=1.30",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.25"]
chroma = ["chromadb>=0.5"]
qdrant = ["qdrant-client>=1.9"]
telegram = ["python-telegram-bot>=21.0"]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/Sherlock/RadarAgent"
Repository = "https://github.com/Sherlock/RadarAgent"
Issues = "https://github.com/Sherlock/RadarAgent/issues"

[project.scripts]
radaragent = "radaragent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/radaragent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["feedparser.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
